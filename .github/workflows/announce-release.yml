name: Announce Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel release announcements

permissions:
  contents: read

jobs:
  announce-release-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.release.prerelease == false
    steps:
      - name: Check if Discord webhook is configured
        id: check-webhook
        run: |
          if [ -n "${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::Discord webhook not configured. Skipping release announcement."
          fi

      - name: Checkout
        if: steps.check-webhook.outputs.configured == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Send Discord Notification
        if: steps.check-webhook.outputs.configured == 'true'
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1
        with:
          webhook_url: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}
          color: "2105893"
          footer_title: "Obot Release"
          footer_timestamp: true
