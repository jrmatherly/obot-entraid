name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'tools/**'
            ui:
              - 'ui/user/**'
            docker:
              - 'Dockerfile'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'

  # Go linting and code validation
  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache golangci-lint
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/golangci-lint
          # Scope cache by branch for better isolation and cache hit rates (free tier)
          key: golangci-lint-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('.golangci.yml', '.golangci.yaml', '.golangci.toml', '.golangci.json') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ github.ref_name }}-
            golangci-lint-${{ runner.os }}-main-
            golangci-lint-${{ runner.os }}-

      - name: Build
        run: make build
        # Note: Auth providers (Entra ID, Keycloak) are now in obot-tools fork
        # See: github.com/jrmatherly/obot-tools

      - name: Validate Go Code
        run: make validate-go-code

  # Go unit tests
  test:
    needs: [changes, lint]
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Integration tests with PostgreSQL
  integration-test:
    needs: [changes, test]
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Use postgres:14 for compatibility (matches upstream)
        image: postgres:18
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Wait for PostgreSQL
        run: sleep 5

      - name: Build obot
        run: make build

      - name: Run integration tests
        # Set DSN inline like upstream for reliable environment propagation
        run: OBOT_SERVER_DSN=postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable make test-integration

  # UI linting and build
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/user/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: ui/user

      - name: Build UI
        run: pnpm run build
        working-directory: ui/user

      - name: Run CI checks
        run: pnpm run ci
        working-directory: ui/user

      - name: Verify no changes
        run: make no-changes

  # Docker build test (PR only - push to main uses docker-build-and-push.yml)
  docker-build:
    needs: [changes, lint]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Pre-fetch base images in parallel
        run: |
          # Pull base images concurrently to reduce sequential wait time (saves 3-4 min)
          docker pull ghcr.io/jrmatherly/obot-tools:latest &
          docker pull ghcr.io/jrmatherly/obot-tools/providers:latest &
          docker pull cgr.dev/chainguard/wolfi-base:latest &
          wait
          echo "Base images pre-fetched successfully"

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true # Load image to local Docker daemon
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max # Persist cache even without push (PR builds)
          outputs: type=docker # Output to Docker daemon for local use

  # Summary job to aggregate results for branch protection
  summary:
    name: CI Summary
    if: always()
    needs: [changes, lint, test, integration-test, ui, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          changes_result="${{ needs.changes.result }}"
          lint_result="${{ needs.lint.result }}"
          test_result="${{ needs.test.result }}"
          integration_result="${{ needs.integration-test.result }}"
          ui_result="${{ needs.ui.result }}"
          docker_result="${{ needs.docker-build.result }}"

          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Changes Detection | ${changes_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${lint_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${test_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Test | ${integration_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI | ${ui_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${docker_result} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any required job failed (skipped is OK for conditional jobs)
          failed=false

          if [[ "$changes_result" == "failure" ]]; then
            echo "Changes detection failed"
            failed=true
          fi

          if [[ "$lint_result" == "failure" ]]; then
            echo "Lint job failed"
            failed=true
          fi

          if [[ "$test_result" == "failure" ]]; then
            echo "Test job failed"
            failed=true
          fi

          if [[ "$integration_result" == "failure" ]]; then
            echo "Integration test job failed"
            failed=true
          fi

          if [[ "$ui_result" == "failure" ]]; then
            echo "UI job failed"
            failed=true
          fi

          if [[ "$docker_result" == "failure" ]]; then
            echo "Docker build job failed"
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "One or more jobs failed. See details above."
            exit 1
          fi

          echo ""
          echo "All jobs completed successfully (or were skipped as expected)."
